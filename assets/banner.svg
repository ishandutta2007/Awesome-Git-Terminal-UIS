<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f355da"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#7000ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="terminal-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f293d" stroke-width="0.7" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: "JetBrains Mono", "Fira Code", monospace;
      font-weight: 500;
      font-size: 17px;
      letter-spacing: 0.8px;
      fill: #8fa0be;
    }
    .pill-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .cursor-blink {
      animation: blink 1s infinite steps(2, start);
    }
    .node-pulse-1 {
      animation: pulse 3s infinite ease-in-out;
    }
    .node-pulse-2 {
      animation: pulse 3.5s infinite ease-in-out 0.8s;
    }
    .node-pulse-3 {
      animation: pulse 4s infinite ease-in-out 1.5s;
    }
    .stream-line {
      stroke-dasharray: 6 10;
      animation: dash 12s linear infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 8px #00f2fe); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -160; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="18" fill="url(#bg-grad)"/>
  <rect width="1200" height="360" rx="18" fill="url(#terminal-grid)"/>

  <!-- Dynamic / Animated Circuit Flow in Background (Non-Obtrusive) -->
  <g opacity="0.38">
    <path class="stream-line" d="M 0 60 Q 300 20 600 80 T 1200 40" stroke="#00f2fe" stroke-width="1.8" fill="none"/>
    <path class="stream-line" d="M 0 310 Q 350 350 700 290 T 1200 320" stroke="#7000ff" stroke-width="2" fill="none"/>
    <path class="stream-line" d="M 900 360 C 950 250 1020 180 1180 140" stroke="#f355da" stroke-width="1.5" fill="none"/>
    
    <!-- Animated Flow Nodes -->
    <circle cx="320" cy="52" r="5" fill="#00f2fe" class="node-pulse-1" filter="url(#glow-cyan)"/>
    <circle cx="850" cy="62" r="6" fill="#4facfe" class="node-pulse-2"/>
    <circle cx="580" cy="305" r="5.5" fill="#f355da" class="node-pulse-3" filter="url(#glow-purple)"/>
  </g>

  <!-- Background Decorative Glowing Orbs -->
  <circle cx="1060" cy="90" r="140" fill="#00f2fe" opacity="0.07" filter="url(#glow-cyan)"/>
  <circle cx="180" cy="280" r="150" fill="#7000ff" opacity="0.08" filter="url(#glow-purple)"/>

  <!-- Foreground Terminal Card Window -->
  <g transform="translate(60, 42)">
    <!-- Container Box -->
    <rect width="1080" height="276" rx="14" fill="#0b111e" fill-opacity="0.82" stroke="url(#card-border)" stroke-width="1.5"/>

    <!-- Mac-style Window Controls -->
    <circle cx="32" cy="30" r="6.5" fill="#ff5f56"/>
    <circle cx="54" cy="30" r="6.5" fill="#ffbd2e"/>
    <circle cx="76" cy="30" r="6.5" fill="#27c93f"/>

    <text x="110" y="34" font-family="'JetBrains Mono', monospace" font-size="12" fill="#52627a">user@workspace: ~/awesome-git-terminal-uis (main)</text>

    <!-- Terminal Command Line -->
    <g transform="translate(32, 74)">
      <text font-family="'JetBrains Mono', monospace" font-size="16" fill="#00f2fe" font-weight="700">➜</text>
      <text x="24" font-family="'JetBrains Mono', monospace" font-size="15" fill="#4ade80" font-weight="600">git tui</text>
      <text x="96" font-family="'JetBrains Mono', monospace" font-size="15" fill="#94a3b8">--explore-ecosystem --keyboard-driven</text>
      <rect x="424" y="-12" width="9" height="18" fill="#00f2fe" class="cursor-blink"/>
    </g>

    <!-- Main Title in Foreground -->
    <g transform="translate(32, 134)">
      <text class="title-text" fill="#ffffff">Awesome Git Terminal UIs</text>
      <text class="title-text" x="555" fill="url(#accent-cyan)">⚡</text>
    </g>

    <!-- Subtitle in Foreground -->
    <text x="32" y="172" class="subtitle-text">Curated TUIs, Git GUIs, Fast CLI Porcelains &amp; Keyboard Workflows</text>

    <!-- Interactive Status / Category Badges (Pills) -->
    <g transform="translate(32, 206)">
      <!-- Pill 1: Lazygit -->
      <g transform="translate(0, 0)">
        <rect width="112" height="34" rx="17" fill="#152138" stroke="#2563eb" stroke-width="1.2"/>
        <circle cx="18" cy="17" r="4.5" fill="#38bdf8"/>
        <text x="31" y="22" class="pill-label">Lazygit</text>
      </g>

      <!-- Pill 2: GitUI -->
      <g transform="translate(124, 0)">
        <rect width="102" height="34" rx="17" fill="#152138" stroke="#ea580c" stroke-width="1.2"/>
        <circle cx="18" cy="17" r="4.5" fill="#fb923c"/>
        <text x="31" y="22" class="pill-label">GitUI</text>
      </g>

      <!-- Pill 3: Tig -->
      <g transform="translate(238, 0)">
        <rect width="84" height="34" rx="17" fill="#152138" stroke="#16a34a" stroke-width="1.2"/>
        <circle cx="18" cy="17" r="4.5" fill="#4ade80"/>
        <text x="31" y="22" class="pill-label">Tig</text>
      </g>

      <!-- Pill 4: Delta -->
      <g transform="translate(334, 0)">
        <rect width="98" height="34" rx="17" fill="#152138" stroke="#9333ea" stroke-width="1.2"/>
        <circle cx="18" cy="17" r="4.5" fill="#c084fc"/>
        <text x="31" y="22" class="pill-label">Delta</text>
      </g>

      <!-- Pill 5: Magit & Neogit -->
      <g transform="translate(444, 0)">
        <rect width="168" height="34" rx="17" fill="#152138" stroke="#0891b2" stroke-width="1.2"/>
        <circle cx="18" cy="17" r="4.5" fill="#22d3ee"/>
        <text x="31" y="22" class="pill-label">Magit &amp; Neogit</text>
      </g>

      <!-- Pill 6: SaaS & GUI -->
      <g transform="translate(624, 0)">
        <rect width="144" height="34" rx="17" fill="#152138" stroke="#e11d48" stroke-width="1.2"/>
        <circle cx="18" cy="17" r="4.5" fill="#f43f5e"/>
        <text x="31" y="22" class="pill-label">SaaS &amp; GUIs</text>
      </g>
    </g>
  </g>
</svg>
